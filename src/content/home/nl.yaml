    rol: Strategie en begeleiding
    tekst: 'Zorgt dat het project klopt: strategie, sales, begeleiding en projectleiding. Eerder 15 jaar projectleider bij SAP-trajecten.'
    foto: /images/team/joost-smaardijk.jpg
    linkedin: https://www.linkedin.com/in/joostsmaardijk/
