faq:
  eyebrow: Veelgestelde vragen
  titel: Wat mensen ons vooraf vragen
  vragen:
  - vraag: Hoe lang duurt een implementatie?
    antwoord: 'Binnen 6 weken ben je live, mits je wensen en afspraken op tijd rond zijn. Live betekent: opgeleverd, getest volgens de afspraken en je team is getraind. Lukt dat niet, dan betaal je bij Volledig ontzorgd en Shared geen licentiekosten over de uitloop.'
  - vraag: Waarom Pipedrive?
    antwoord: Pipedrive is eenvoudig genoeg om dagelijks te gebruiken en krachtig genoeg om mee te groeien. Dat laatste is de reden dat teams het blijven gebruiken.
  - vraag: Kan Pipedrive ook projecten beheren?
    antwoord: Ja, met Projects. Een gewonnen deal wordt met één klik een project, met fases, taken en planning, en alle klantinformatie gaat mee. Projects zit in het Premium-abonnement en hoger; bij lagere abonnementen is het een add-on. Wij richten het in als onderdeel van je traject.
  - vraag: Wat als mijn team het niet gebruikt?
    antwoord: Daar is de garantie op gebruik voor. We kijken na 60 dagen samen of je team actief met Pipedrive werkt. Zo niet, dan krijg je een gratis extra trainingssessie. Geldt voor Volledig ontzorgd en Shared.
  - vraag: Wat kost het?
    antwoord: 'Zelfstandig kost €4.950, Shared €7.950 en Volledig ontzorgd €12.950. Na de start kies je een onderhoudsabonnement: Basis €595, Plus €1.250 of Max €2.450 per maand. Alles excl. btw. Na het eerste gesprek ontvang je een voorstel.'
