faq:
  eyebrow: Veelgestelde vragen
  titel: Wat mensen ons vooraf vragen
  vragen:
  - vraag: Hoe lang duurt een implementatie?
    antwoord: 'Binnen 6 weken ben je live, mits je requirements op orde zijn. Live betekent: opgeleverd, getest volgens de afspraken en je team is getraind. Lukt dat niet, dan betaal je bij Volledig ontzorgd en Shared geen licentiekosten over de uitloop.'
  - vraag: Waarom Pipedrive?
    antwoord: Pipedrive is eenvoudig genoeg om dagelijks te gebruiken en krachtig genoeg om mee te groeien. Dat laatste is de reden dat teams het blijven gebruiken.
  - vraag: Wat als mijn team het niet gebruikt?
    antwoord: Daar is de garantie op gebruik voor. We kijken na 60 dagen samen of je team actief met Pipedrive werkt. Zo niet, dan krijg je een gratis extra trainingssessie. Geldt voor Volledig ontzorgd en Shared.
  - vraag: Kan ik mijn bestaande data meenemen?
    antwoord: Ja. We zetten data uit Excel, mailboxen of je huidige CRM over naar Pipedrive en ruimen duplicaten op.
  - vraag: Wat is klaar voor AI?
    antwoord: AI is zo goed als de data waar het op werkt. Wij richten Pipedrive in met schone, consistente data, zodat je daar later AI-toepassingen op kunt zetten.
  - vraag: Wat kost het?
    antwoord: 'Zelfstandig kost €4.950, Shared €7.950 en Volledig ontzorgd €12.950. Na livegang kies je een SLA: Basis €595, Plus €1.250 of Max €2.450 per maand. Alles excl. btw. Na het eerste gesprek ontvang je een voorstel.'
  - vraag: Heb ik al een Pipedrive-licentie nodig?
    antwoord: 'Nee. Dat bespreken we in het eerste gesprek, en we adviseren welk abonnement past. Als Pipedrive-partner starten we je proefperiode via onze partnerlink: 30 dagen in plaats van 14.'
