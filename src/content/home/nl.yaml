seo:
  titel: 'FortCRM: Pipedrive-implementatie voor het MKB'
  beschrijving: 'FortCRM implementeert Pipedrive voor MKB-bedrijven en zorgt dat je team het blijft gebruiken: inrichting, automatisering en een maandelijks ambitiegesprek.'
  deelTitel: 'FortCRM: Pipedrive dat je team echt gebruikt'
hero:
  eyebrow: Pipedrive-implementatie voor het MKB
  titel: Pipedrive dat je team _écht_ gebruikt.
  intro: Wij richten Pipedrive in, bouwen de automatisering eromheen en sturen elke maand bij. Zodat je geen CRM hebt dat na drie weken stof vergaart, maar een systeem dat de basis van je bedrijf wordt. En klaar voor AI.
  belofte: Binnen 6 weken live. Na 60 dagen gebruikt je team het nog. Lukt dat niet, dan staan wij ervoor in.*
  knopGesprek: Plan een gesprek
  knopPakketten: Bekijk de pakketten
  knopScan: Of doe eerst de CRM-check (2 min)
  voetnoot: '* Niet binnen 6 weken live, terwijl jouw requirements op orde waren? Dan betaal je geen licentiekosten over de uitloop. Werkt je team na 60 dagen niet actief met Pipedrive, dan krijg je een gratis extra trainingssessie. Beide garanties gelden voor Volledig ontzorgd en Shared. Wat actief is, leggen we vooraf samen vast.'
  feiten:
  - kop: Pipedrive
    tekst: Eén CRM als bron van waarheid voor je klantdata
  - kop: Authorized partner
    tekst: Officieel partner van Pipedrive
  - kop: 5 tot 250 medewerkers
    tekst: Het MKB waar wij het verschil maken
  beeld:
  beeldAlt: ''
herkenbaar:
  eyebrow: Herkenbaar?
  titel: Dit horen we bij bijna elk MKB-bedrijf
  kaarten:
  - citaat: Opvolgen gebeurt als er tijd is.
    tekst: Er komen dagelijks aanvragen en orders binnen, maar iedereen handelt ze anders af.
  - citaat: Dat weet alleen wie erbij zat.
    tekst: Eén deal kost vijf gesprekken. Wat er is besproken, weet alleen degene die erbij zat.
  - citaat: Het gaat op gevoel.
    tekst: Je maakt weinig offertes, maar elke offerte telt. Opvolgen gaat op gevoel.
  slotVet: Een CRM werkt niet doordat het er staat.
  slot: Pipedrive werkt als het past bij hoe jouw team werkt, en als je het blijft bijsturen. Dat is wat wij doen.
aanpak:
  eyebrow: Onze aanpak
  titel: Van eerste gesprek tot een team dat het gebruikt
  intro: Vijf stappen. Na elke stap weet je wat je krijgt.
  stappen:
  - titel: Kennismaking
    tekst: Een gesprek van 30 minuten over hoe jullie nu werken en wat je wilt bereiken. Deed je de CRM-check, dan nemen we je uitslag mee.
    resultaat: Een eerlijk antwoord of Pipedrive past.
  - titel: Ontwerp
    tekst: We leggen vast hoe een aanvraag een klant wordt, in jullie eigen woorden.
    resultaat: Een inrichtingsplan dat je team herkent.
  - titel: Inrichting en automatisering
    tekst: FortCRM richt Pipedrive in, zet je data over en bouwt de automatisering eromheen.
    resultaat: Een werkend Pipedrive, klaar voor gebruik.
  - titel: Training en livegang
    tekst: Je team leert werken in de situatie zoals die echt is, niet in een demo. Binnen 6 weken na de start ben je live.
    resultaat: Je team werkt in Pipedrive.
  - titel: Bijsturen
    tekst: Na 60 dagen kijken we samen of je team actief met Pipedrive werkt. Zo niet, dan krijg je een gratis extra trainingssessie.
    resultaat: Gebruik dat blijft.
  naderhandTitel: 'Daarna: het ambitiegesprek'
  naderhandTekst: Wat werkt, wat niet, en wat de volgende stap is. Zo groeit Pipedrive mee met je bedrijf. Onderdeel van elke SLA.
voorWie:
  eyebrow: Voor wie we werken
  titel: Drie soorten bedrijven waar Pipedrive het verschil maakt
  kaarten:
  - titel: Weinig deals, hoge slagingskans
    tekst: Bijvoorbeeld bouwbedrijven. Je maakt weinig offertes en elke telt. Winst zit in strakke opvolging van elke offerte.
    pagina: weinig-deals
    icoon: offerte
  - titel: Maatwerk en advies met meerdere gesprekken
    tekst: Adviesbureaus en bureaus waar één deal meerdere gesprekken kost. Winst zit in een compleet klantbeeld, ook als iemand anders het overneemt.
    pagina: advies-maatwerk
    icoon: gesprek
  - titel: Veel aanvragen, veel orders
    tekst: 'Kleine bedragen, grote aantallen. Winst zit in snelheid en een vaste route: elke aanvraag wordt op dezelfde manier opgepakt.'
    pagina: veel-aanvragen
    icoon: trechter
  oproep: Herken je jezelf in een van de drie? Plan een gesprek van 30 minuten, dan kijken we wat Pipedrive voor jouw team kan doen. Past het niet, dan zeggen we dat eerlijk.
  oproepLink: Plan een gesprek van 30 minuten
  nietVoorTitel: Voor wie we het niet zijn
  nietVoorTekst: 'Werk je met één of twee mensen? Dan is een uitgebreide inrichting misschien nog niet nodig. Plan toch een gesprek: we kijken samen of het past en als er een betere eerste stap is, zeggen we dat.'
  meerTekst: Bekijk wat we inrichten
