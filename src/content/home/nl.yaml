seo:
  titel: 'FortCRM: Pipedrive-implementatie voor het MKB'
  beschrijving: 'FortCRM implementeert Pipedrive voor MKB-bedrijven en zorgt dat je team het blijft gebruiken: inrichting, automatisering en een maandelijks ambitiegesprek.'
  deelTitel: 'FortCRM: Pipedrive dat je team echt gebruikt'
hero:
  eyebrow: Pipedrive-specialist voor het MKB
  titel: Al je klanten, offertes en afspraken op _één plek_.
  intro: 'Wij richten Pipedrive voor je in: het systeem waarin je hele team klantcontact, afspraken, offertes en de uitvoering daarna bijhoudt. Zo blijft er niets liggen en weet iedereen wat er speelt.'
  uitleg: ''
  beeldOnderschrift: ''
  belofte: Binnen 6 weken live. Na 60 dagen gebruikt je team het nog. Lukt dat niet, dan staan wij ervoor in.*
  knopGesprek: Plan een gesprek
  knopPakketten: Bekijk de pakketten
  knopScan: Of doe eerst de CRM-check (2 min)
  voetnoot: '* Niet binnen 6 weken live, terwijl jouw wensen en afspraken op tijd rond waren? Dan betaal je geen licentiekosten over de uitloop. Werkt je team na 60 dagen niet actief met Pipedrive, dan krijg je een gratis extra trainingssessie. Beide garanties gelden voor Volledig ontzorgd en Shared. Wat actief is, leggen we vooraf samen vast.'
  beeld:
  beeldAlt: ''
pipedrive:
  eyebrow: Pipedrive Authorized Partner
  titel: Officieel partner van Pipedrive
  tekst: FortCRM is Authorized Partner van Pipedrive. Wij richten het in zoals het bij jouw team past, van eerste aanvraag tot oplevering, en zorgen dat je de functies gebruikt die het verschil maken.
  voordelen: []
  functiesTitel: Wat Pipedrive voor je team doet
  functies:
  - titel: E-mailsynchronisatie
    tekst: Je mailbox gekoppeld aan Pipedrive. Elke mail komt bij de juiste klant en deal.
    icoon: mail
  - titel: Agendakoppeling
    tekst: Afspraken uit Google of Outlook staan in Pipedrive, en andersom.
    icoon: agenda
  - titel: Afspraken inplannen
    tekst: Klanten kiezen zelf een moment via je planningslink. Geen heen-en-weer gemail.
    icoon: afspraak
  - titel: WhatsApp
    tekst: Gesprekken met klanten voeren en vastleggen vanuit Pipedrive.
    icoon: chat
  - titel: 'Nova: AI-notities'
    tekst: Nova maakt notities van je klantgesprekken en zet de vervolgstappen klaar.
    icoon: notitie
  - titel: Automatiseringen
    tekst: Taken, mails en updates lopen vanzelf, op basis van wat er in een deal gebeurt.
    icoon: bliksem
  - titel: Campaigns
    tekst: Nieuwsbrieven en mailcampagnes vanuit Pipedrive, naar de juiste groep klanten. Je ziet wie opent en klikt.
    icoon: campagne
  - titel: Projects
    tekst: 'Na de verkoop: planning, taken en oplevering in hetzelfde systeem. Een gewonnen deal wordt met één klik een project.'
    icoon: project
  - titel: Rapportages
    tekst: Dashboards met je verkoopoverzicht, verwachte omzet en resultaten per verkoper.
    icoon: grafiek
  - titel: Mobiele app
    tekst: Alles bij de hand onderweg, ook een gesprek vastleggen direct na een bezoek.
    icoon: mobiel
  knop: ''
  knopLink: ''
ai:
  tonen: true
  eyebrow: AI en koppelingen
  titel: Pipedrive als basis voor AI
  intro: 'AI is zo slim als de gegevens eronder. Staat alles goed in Pipedrive, dan werkt AI voor je hele team: in het systeem zelf, in je eigen AI-assistent en in je andere software.'
  kolommen:
  - titel: AI in Pipedrive
    icoon: ai
    punten:
    - vet: Nova
      tekst: bereidt gesprekken voor, maakt notities en zet vervolgstappen klaar. Het stelt updates voor je deals voor en jij keurt ze goed. Nova zit in elk abonnement.
    - vet: Sales Assistant
      tekst: beantwoordt vragen over je klanten en deals in gewone taal.
    - vet: Mail en rapportages.
      tekst: AI schrijft en vat mails samen, en maakt een rapport op basis van één vraag.
  - titel: Je eigen AI aan Pipedrive
    icoon: chat
    punten:
    - vet: ''
      tekst: Via de officiële Pipedrive-koppeling (MCP) werkt Claude of ChatGPT direct met je Pipedrive-gegevens.
    - vet: ''
      tekst: 'Stel een vraag als: "Welke offertes staan langer dan twee weken open?"'
    - vet: ''
      tekst: Laat AI deals bijwerken, activiteiten inplannen en leads omzetten. Jij houdt de regie.
  - titel: Alles praat met elkaar
    icoon: koppeling
    punten:
    - vet: ''
      tekst: Pipedrive is het middelpunt. Wij koppelen het aan je boekhouding, website, mail, agenda, telefonie en planning.
    - vet: ''
      tekst: Zo lopen automatiseringen over systemen heen.
    - vet: 'Voorbeeld:'
      tekst: offerte geaccepteerd, factuur klaar in je boekhouding, project aangemaakt en het team op de hoogte. Zonder overtypen.
  slot: Eerst de basis op orde, dan AI erop. Daarom beginnen we bij de inrichting.
herkenbaar:
  eyebrow: Herkenbaar?
  titel: Dit horen we bij bijna elk MKB-bedrijf
  kaarten:
  - citaat: Opvolgen gebeurt als er tijd is.
    tekst: Er komen dagelijks aanvragen en orders binnen, maar iedereen handelt ze anders af.
  - citaat: Dat weet alleen wie erbij zat.
    tekst: Eén deal kost vijf gesprekken. Wat er is besproken, weet alleen degene die erbij zat.
  - citaat: Wat hadden we nou afgesproken?
    tekst: Afspraken staan in mailtjes, notitieblokken en hoofden. Terugzoeken kost tijd, en soms een klant.
