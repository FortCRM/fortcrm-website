pipedrive:
  eyebrow: Pipedrive Authorized Partner
  titel: An official Pipedrive partner
  tekst: FortCRM is an Authorized Partner of Pipedrive. We set it up the way your team works, from first lead to delivery, and make sure you use the features that make the difference.
  voordelen: []
  functiesTitel: What Pipedrive does for your team
  functies:
  - titel: Email sync
    tekst: Your mailbox connected to Pipedrive. Every email lands with the right contact and deal.
    icoon: mail
  - titel: Calendar sync
    tekst: Meetings from Google or Outlook show up in Pipedrive, and the other way round.
    icoon: agenda
  - titel: Meeting scheduler
    tekst: Clients pick a time through your booking link. No back-and-forth emails.
    icoon: afspraak
  - titel: WhatsApp
    tekst: Hold and log conversations with clients from within Pipedrive.
    icoon: chat
  - titel: 'Nova: AI notes'
    tekst: Nova takes notes of your client meetings and prepares the next steps.
    icoon: notitie
  - titel: Automations
    tekst: Tasks, emails and updates run by themselves, based on what happens in a deal.
    icoon: bliksem
  - titel: Campaigns
    tekst: Newsletters and email campaigns from Pipedrive, sent to the right group of customers. See who opens and clicks.
    icoon: campagne
  - titel: Projects
    tekst: 'After the sale: planning, tasks and delivery in the same system. A won deal becomes a project in one click.'
    icoon: project
  - titel: Reporting
    tekst: Dashboards with your pipeline, expected revenue and results per rep.
    icoon: grafiek
  - titel: Mobile app
    tekst: Everything at hand on the road, including logging a meeting right after a visit.
    icoon: mobiel
  knop: ''
  knopLink: ''
ai:
  tonen: true
  eyebrow: AI and integrations
  titel: Pipedrive as the foundation for AI
  intro: 'AI is only as smart as the data underneath. When everything is right in Pipedrive, AI works for your whole team: in the system itself, in your own AI assistant and in your other software.'
  kolommen:
  - titel: AI in Pipedrive
    icoon: ai
    punten:
    - vet: Nova
      tekst: prepares meetings, takes notes and lines up next steps. It suggests updates to your deals and you approve them. Nova is included in every plan.
    - vet: Sales Assistant
      tekst: answers questions about your clients and deals in plain language.
    - vet: Email and reports.
      tekst: AI writes and summarises emails, and builds a report from a single question.
  - titel: Your own AI on Pipedrive
    icoon: chat
    punten:
    - vet: ''
      tekst: With the official Pipedrive connection (MCP), Claude or ChatGPT works directly with your Pipedrive data.
    - vet: ''
      tekst: 'Ask things like: "Which quotes have been open for more than two weeks?"'
    - vet: ''
      tekst: Let AI update deals, schedule activities and convert leads. You stay in control.
  - titel: Everything talks to each other
    icoon: koppeling
    punten:
    - vet: ''
      tekst: Pipedrive is the hub. We connect it to your accounting, website, email, calendar, phone system and planning.
    - vet: ''
      tekst: That way, automations run across systems.
    - vet: 'Example:'
      tekst: quote accepted, invoice ready in your accounting, project created and the team informed. No retyping.
  slot: Get the foundation right first, then add AI.
herkenbaar:
  eyebrow: Sound familiar?
  titel: What we hear at almost every growing business
  kaarten:
  - citaat: Follow-up happens when there's time.
    tekst: Requests and orders come in every day, but everyone handles them differently.
  - citaat: Only the person who was there knows.
    tekst: One deal takes five conversations. What was discussed is known only to whoever was in the room.
  - citaat: What did we agree again?
    tekst: Agreements live in emails, notepads and people's heads. Looking them up costs time, and sometimes a client.
