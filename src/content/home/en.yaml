faq:
  eyebrow: FAQ
  titel: What people ask us up front
  vragen:
  - vraag: How long does an implementation take?
    antwoord: 'You are live within 6 weeks, provided your requirements are in order. Live means: delivered, tested against what we agreed and your team is trained. If we miss that, with Fully managed and Shared you pay no licence fees for the overrun.'
  - vraag: Why Pipedrive?
    antwoord: Pipedrive is simple enough to use every day and powerful enough to grow with you. That second part is why teams keep using it.
  - vraag: Can Pipedrive manage projects too?
    antwoord: Yes, with Projects. A won deal becomes a project in one click, with phases, tasks and planning, and all client information carries over. Projects is included in the Premium plan and up; on lower plans it is an add-on. We set it up as part of your project.
  - vraag: What if my team doesn't use it?
    antwoord: That is what the usage guarantee is for. After 60 days we check together whether your team is actively using Pipedrive. If not, you get an extra training session for free. Applies to Fully managed and Shared.
  - vraag: What does it cost?
    antwoord: 'Self-directed costs from €4,950, Shared from €7,950 and Fully managed from €12,950. After go-live you choose an SLA: Basic €595, Plus €1,250 or Max €2,450 per month. All excluding VAT. After the first call you receive a proposal.'
