faq:
  eyebrow: FAQ
  titel: What people ask us up front
  vragen:
  - vraag: How long does an implementation take?
    antwoord: 'You are live within 6 weeks, provided your requirements are in order. Live means: delivered, tested against what we agreed and your team is trained. If we miss that, with Fully managed and Shared you pay no licence fees for the overrun.'
  - vraag: Why Pipedrive?
    antwoord: Pipedrive is simple enough to use every day and powerful enough to grow with you. That second part is why teams keep using it.
  - vraag: What if my team doesn't use it?
    antwoord: That is what the usage guarantee is for. After 60 days we check together whether your team is actively using Pipedrive. If not, you get an extra training session for free. Applies to Fully managed and Shared.
  - vraag: Can I bring my existing data?
    antwoord: Yes. We move data from Excel, mailboxes or your current CRM to Pipedrive and clean up duplicates.
  - vraag: What does ready for AI mean?
    antwoord: AI is only as good as the data it works on. We set up Pipedrive with clean, consistent data, so you can build AI applications on top of it later.
  - vraag: What does it cost?
    antwoord: 'Self-directed costs €4,950, Shared €7,950 and Fully managed €12,950. After go-live you choose an SLA: Basic €595, Plus €1,250 or Max €2,450 per month. All excluding VAT. After the first call you receive a proposal.'
  - vraag: Do I already need a Pipedrive licence?
    antwoord: 'No. We discuss that in the first call and advise which plan fits. As a Pipedrive partner we start your trial through our partner link: 30 days instead of 14.'
