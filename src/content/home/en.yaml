seo:
  titel: 'FortCRM: Pipedrive implementation for SMEs'
  beschrijving: 'FortCRM implements Pipedrive for small and medium-sized businesses and makes sure your team keeps using it: setup, automation and a recurring ambition review.'
  deelTitel: 'FortCRM: Pipedrive your team actually uses'
hero:
  eyebrow: Pipedrive specialist for SMEs
  titel: All your clients, quotes and meetings in _one place_.
  intro: 'We set up Pipedrive for you: the system where your whole team keeps track of client contact, quotes and follow-up. Nothing slips through and everyone knows what is going on.'
  uitleg: 'Pipedrive is a CRM: software where you keep all your clients, deals and meetings, for the whole team.'
  beeldOnderschrift: 'This is what your sales look like in Pipedrive: every lead in a column, until it is won.'
  belofte: Live within 6 weeks. Still in use after 60 days. If not, we stand behind it.*
  knopGesprek: Book a call
  knopPakketten: See the packages
  knopScan: ''
  voetnoot: '* Not live within 6 weeks while your requirements were in order? Then you pay no licence fees for the overrun. If your team is not actively using Pipedrive after 60 days, you get an extra training session for free. Both guarantees apply to Fully managed and Shared. What active means is agreed together up front.'
  beeld:
  beeldAlt: ''
pipedrive:
  eyebrow: Pipedrive Authorized Partner
  titel: An official Pipedrive partner
  tekst: FortCRM is an Authorized Partner of Pipedrive. We set it up the way your team works, and make sure you use the features that make the difference.
  voordelen:
  - 30-day trial through our partner link instead of 14
  - Advice on the plan that fits your team
  - One point of contact for setup, integrations and questions
  functiesTitel: What Pipedrive does for your team
  functies:
  - titel: Email sync
    tekst: Your mailbox connected to Pipedrive. Every email lands with the right contact and deal.
    icoon: mail
  - titel: Calendar sync
    tekst: Meetings from Google or Outlook show up in Pipedrive, and the other way round.
    icoon: agenda
  - titel: Meeting scheduler
    tekst: Clients pick a time through your booking link. No back-and-forth emails.
    icoon: afspraak
  - titel: WhatsApp
    tekst: Hold and log conversations with clients from within Pipedrive.
    icoon: chat
  - titel: 'Nova: AI notes'
    tekst: Nova takes notes of your client meetings and prepares the next steps.
    icoon: notitie
  - titel: Automations
    tekst: Tasks, emails and updates run by themselves, based on what happens in a deal.
    icoon: bliksem
  - titel: Reporting
    tekst: Dashboards with your pipeline, expected revenue and results per rep.
    icoon: grafiek
  - titel: Mobile app
    tekst: Everything at hand on the road, including logging a meeting right after a visit.
    icoon: mobiel
  knop: ''
  knopLink: ''
herkenbaar:
  eyebrow: Sound familiar?
  titel: What we hear at almost every growing business
  kaarten:
  - citaat: Follow-up happens when there's time.
    tekst: Requests and orders come in every day, but everyone handles them differently.
  - citaat: Only the person who was there knows.
    tekst: One deal takes five conversations. What was discussed is known only to whoever was in the room.
  - citaat: It runs on gut feeling.
    tekst: You send few quotes, but every quote counts. Follow-up runs on gut feeling.
  slotVet: A CRM doesn't work because it's there.
  slot: Pipedrive works when it fits how your team works, and when you keep steering it. That is what we do.
aanpak:
  eyebrow: Our approach
  titel: From first call to a team that uses it
  intro: Five steps. After each step you know what you get.
  stappen:
  - titel: Introduction
    tekst: A 30-minute call about how you work today and what you want to achieve.
    resultaat: An honest answer on whether Pipedrive fits.
  - titel: Design
    tekst: We map how a request becomes a customer, in your own words.
    resultaat: A setup plan your team recognises.
  - titel: Setup and automation
    tekst: FortCRM sets up Pipedrive, migrates your data and builds the automation around it.
    resultaat: A working Pipedrive, ready to use.
  - titel: Training and go-live
    tekst: Your team learns to work in your real situation, not in a demo. You are live within 6 weeks of the start.
    resultaat: Your team works in Pipedrive.
  - titel: Steering
    tekst: After 60 days we check together whether your team is actively using Pipedrive. If not, you get an extra training session for free.
    resultaat: Usage that lasts.
  naderhandTitel: 'After that: the ambition review'
  naderhandTekst: What works, what doesn't, and what the next step is. That way Pipedrive grows with your business. Part of every SLA.
voorWie:
  eyebrow: Who we help
  titel: Three kinds of businesses where Pipedrive makes the difference
  kaarten:
  - titel: Few deals, high win rate
    tekst: Construction companies, for example. You send few quotes and each one counts. The gain is in tight follow-up on every quote.
    pagina: ''
    icoon: offerte
  - titel: Custom work and advice with several conversations
    tekst: Consultancies and agencies where one deal takes several conversations. The gain is a complete customer picture, even when someone else takes over.
    pagina: ''
    icoon: gesprek
  - titel: Many requests, many orders
    tekst: 'Small amounts, large volumes. The gain is speed and a fixed route: every request is handled the same way.'
    pagina: ''
    icoon: trechter
  oproep: Recognise yourself in one of these? Book a 30-minute call and we'll look at what Pipedrive can do for your team. If it is not a fit, we'll tell you honestly.
  oproepLink: Book a 30-minute call
  nietVoorTitel: Who we are not for
  nietVoorTekst: 'Working with one or two people? Then an extensive setup may not be needed yet. Book a call anyway: we''ll see together whether it fits, and if there is a better first step, we''ll say so.'
  meerTekst: See what we set up
