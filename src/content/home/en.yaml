seo:
  titel: 'FortCRM: Pipedrive implementation for SMEs'
  beschrijving: 'FortCRM sets up Pipedrive for SMEs: clients, meetings, quotes and projects in one place. The foundation for AI, live within 6 weeks.'
  deelTitel: 'FortCRM: Pipedrive your team actually uses'
