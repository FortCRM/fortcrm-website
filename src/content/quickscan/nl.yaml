niveaus:
  niet: Nog niet op orde
  deels: Gedeeltelijk op orde
  wel: Op orde
vastleggen:
  niet: Klantgegevens staan verspreid. Eerst één plek waar alles terechtkomt, met vaste velden.
  deels: Het meeste staat erin, maar niet bij iedereen op dezelfde manier. Vaste velden en afspraken maken het betrouwbaar.
  wel: Je legt vast op één plek en op één manier. Dat is de basis voor automatisering en AI.
opvolgen:
  niet: Opvolgen hangt af van wie er tijd heeft. Een vaste route met herinneringen voorkomt dat deals blijven liggen.
  deels: Meestal gaat het goed, maar drukte kost deals. Automatische herinneringen en vaste stappen vangen dat op.
  wel: Opvolgen is geregeld. Het blijft de vraag of het ook zo blijft als je groeit.
delen:
  niet: Kennis zit in hoofden. Zodra iemand er niet is, valt een deal stil.
  deels: Overnemen kan, maar kost uitzoekwerk. Dat vraagt om een gedeeld klantbeeld per contact en deal.
  wel: Je team kan elkaar overnemen zonder te bellen. Dat is zeldzaam.
typeA:
  kop: Veel aanvragen, veel klanten
  tekst: Bij veel aanvragen telt dat elke lead dezelfde route volgt. Snel reageren en automatisch opvolgen levert hier het meeste op.
  stap1: Zet alle aanvraagkanalen in één verkoopoverzicht.
  stap2: Leg een vaste route met herinneringen vast.
  stap3: Automatiseer de eerste reactie en de taken erna.
typeB:
  kop: Advies en maatwerk
  tekst: Bij meerdere gesprekken per deal gaat informatie verloren tussen de gesprekken. Een compleet klantbeeld per deal maakt het verschil.
  stap1: Leg na elk gesprek vast wat er is besproken, met een vaste structuur.
  stap2: Koppel mail en agenda aan de deal.
  stap3: Maak per fase duidelijk wat de volgende stap is.
typeC:
  kop: Weinig opdrachten, groot werk
  tekst: Bij weinig offertes mag er geen enkele blijven liggen. Een strakke offerteopvolging is hier goud waard.
  stap1: Registreer elke offerte met een opvolgdatum.
  stap2: Laat Pipedrive een taak aanmaken als een offerte blijft liggen.
  stap3: Houd per offerte de kans en de verwachte waarde bij.
typeD:
  kop: Nog zoekend naar de beste inrichting
  tekst: Eerst zorgen dat de basis klopt. Daarna kiezen we samen welke route bij je bedrijf past.
  stap1: Breng in kaart hoe een aanvraag nu een klant wordt.
  stap2: Kies de kleinste inrichting die dat ondersteunt.
  stap3: Bouw uit zodra het team het gebruikt.
wens:
  lead: Je wilt geen aanvraag meer laten liggen. Dat vraagt om een vaste opvolgroute.
  overzicht: Je wilt overzicht in je verkoop en omzet. Dat vraagt eerst om betrouwbare invoer.
  handwerk: Je wilt minder handwerk. Dat lossen we op met automatisering rond Pipedrive.
  gebruik: Je wilt dat je team het gebruikt. Dat bereik je met een inrichting die past bij hoe jullie werken.
