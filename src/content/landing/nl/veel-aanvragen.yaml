titel: Veel aanvragen, veel orders
beschrijving: 'FortCRM voor bedrijven met veel aanvragen en orders: één pijplijn, vaste route en automatische opvolging in Pipedrive.'
eyebrow: Veel aanvragen, veel orders
kop: Elke aanvraag op dezelfde manier opgepakt.
intro: Kleine bedragen, grote aantallen. Je groeit niet door meer te doen, maar door elke aanvraag dezelfde route te laten volgen.
pijnTitel: Waar dit soort bedrijven tegenaan loopt
pijnpunten:
- Er komen dagelijks aanvragen en orders binnen, maar iedereen handelt ze anders af.
- Opvolgen gebeurt als er tijd is, en zodra het druk wordt blijft er werk liggen.
- Aanvragen komen binnen via mail, telefoon, formulier en webshop, en staan overal verspreid.
inrichtingTitel: Pipedrive voor jouw situatie
inrichting:
- titel: Eén pijplijn voor alle kanalen
  tekst: Alle aanvragen komen op één plek binnen, met vaste velden en een duidelijke eigenaar.
- titel: Automatische opvolging
  tekst: Herinneringen, taken en eerste reacties lopen automatisch. Niets blijft liggen.
- titel: Koppelingen
  tekst: Wij koppelen Pipedrive aan je webformulier, webshop en mail, zodat handwerk verdwijnt.
slot: Bij veel aanvragen telt dat elke lead dezelfde route volgt.
