titel: Weinig deals, hoge slagingskans
beschrijving: 'FortCRM voor bedrijven met weinig deals en een hoge slagingskans, zoals bouwbedrijven: strakke offerteopvolging in Pipedrive.'
eyebrow: Weinig deals, hoge slagingskans
kop: Geen enkele offerte laten liggen.
intro: Bijvoorbeeld bouwbedrijven. Je maakt weinig offertes en elke telt. Dan wil je opvolging die niet van het gevoel afhangt.
pijnTitel: Waar dit soort bedrijven tegenaan loopt
pijnpunten:
- Je maakt weinig offertes, maar elke offerte telt.
- Opvolgen gaat op gevoel. Soms hoor je weken niets meer.
- Je weet niet hoeveel omzet er in de lucht hangt.
inrichtingTitel: Pipedrive voor jouw situatie
inrichting:
- titel: Elke offerte met opvolgdatum
  tekst: Elke offerte krijgt een eigenaar, een verwachte waarde en een datum voor de volgende stap.
- titel: Waarschuwing bij stilstand
  tekst: Pipedrive maakt een taak aan zodra een offerte blijft liggen.
- titel: Zicht op de verwachte omzet
  tekst: Een overzicht van wat er loopt, met kans en waarde per offerte.
slot: Bij weinig offertes mag er geen enkele blijven liggen.
