titel: Maatwerk en advies met meerdere gesprekken
beschrijving: 'FortCRM voor bureaus en adviesbedrijven met maatwerk en meerdere gesprekken per deal: een compleet klantbeeld per deal in Pipedrive.'
eyebrow: Maatwerk en advies met meerdere gesprekken
kop: Alles wat er is besproken, voor iedereen terug te vinden.
intro: Adviesbureaus en bureaus waar één deal meerdere gesprekken kost. Je kennis zit in hoofden, en dat is een risico zodra iemand er niet is.
pijnTitel: Waar dit soort bedrijven tegenaan loopt
pijnpunten:
- Eén deal kost vijf gesprekken. Wat er is besproken, weet alleen degene die erbij zat.
- Na een gesprek staat de volgende stap in een notitie, een mail of nergens.
- Een collega moet overnemen en begint opnieuw.
inrichtingTitel: Pipedrive voor jouw situatie
inrichting:
- titel: Compleet klantbeeld
  tekst: 'Per contact en deal staat alles bij elkaar: gesprekken, mails, afspraken en de volgende stap.'
  icoon: gesprek
- titel: Vaste structuur na elk gesprek
  tekst: Een korte, vaste manier van vastleggen die niemand tijd kost.
  icoon: mensen
- titel: Koppeling met mail en agenda
  tekst: Mail en afspraken komen automatisch bij de juiste deal terecht.
  icoon: koppeling
slot: Bij meerdere gesprekken per deal gaat informatie verloren tussen de gesprekken.
