titel: Advice and custom work
beschrijving: 'FortCRM for consultancies and custom work: every meeting and decision recorded in Pipedrive, from first conversation to order and delivery.'
eyebrow: Advice and custom work
kop: Everything discussed, easy for everyone to find.
intro: Consultancies and agencies where one deal takes several conversations. Your knowledge lives in people's heads, and that is a risk as soon as someone is away.
pijnTitel: What these companies run into
pijnpunten:
- One deal takes five conversations. Only the person who was there knows what was said.
- After a meeting the next step ends up in a note, an email or nowhere.
- A colleague has to take over and starts from scratch.
inrichtingTitel: Pipedrive for your situation
inrichting:
- titel: Complete client view
  tekst: 'Everything per contact and deal in one place: conversations, emails, meetings and the next step.'
  icoon: gesprek
- titel: A fixed structure after every meeting
  tekst: A short, fixed way of recording that takes no one any time.
  icoon: mensen
- titel: Email and calendar connected
  tekst: Emails and meetings automatically end up with the right deal.
  icoon: koppeling
- titel: From order to project
  tekst: A won order becomes a project with phases and tasks. Whoever does the work sees right away what was discussed with the client.
  icoon: project
slot: With several conversations per deal, information gets lost in between.
vertaling: advies-maatwerk
